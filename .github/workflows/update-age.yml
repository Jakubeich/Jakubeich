name: Update age

on:
  schedule:
    # Každý rok 9. srpna v 06:00 UTC
    - cron: "0 6 9 8 *"

  # Umožní ruční spuštění přes GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Calculate and update age
        run: |
          python3 <<'PY'
          from datetime import date
          from pathlib import Path
          import re

          # Datum narození: 9. 8. 2005
          birth_date = date(2005, 8, 9)

          # Aktuální datum
          today = date.today()

          # Výpočet věku
          age = (
              today.year
              - birth_date.year
              - (
                  (today.month, today.day)
                  < (birth_date.month, birth_date.day)
              )
          )

          # README
          readme_path = Path("README.md")
          content = readme_path.read_text(encoding="utf-8")

          # Najde věk mezi AGE_START a AGE_END a nahradí ho
          updated_content = re.sub(
              r"<!-- AGE_START -->\d+<!-- AGE_END -->",
              f"<!-- AGE_START -->{age}<!-- AGE_END -->",
              content,
          )

          if content == updated_content:
              print(f"Age is already correct: {age}")
          else:
              print(f"Updating age to: {age}")

          readme_path.write_text(
              updated_content,
              encoding="utf-8"
          )
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "chore: update age"
          git push
